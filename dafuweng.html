<!doctype html><!-- source-sha256:3bde0bc870ac468154102b9dff6c5130cd0297d23fe21536e4a6dca60bd190d5 --><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>围坐 CLUB · 离线人机试玩</title><style>/* Club lobby and shared controls. */
:root{--ink:#243d3c;--muted:#7d8983;--paper:#f6f4ed;--line:#e2e5d9;--green:#25594d;--orange:#ef7c54;--mint:#dcebe0}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
button,input{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.5;cursor:wait}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #ecaa44;outline-offset:3px}
.shell{max-width:1480px;margin:auto;display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.sidebar{padding:38px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:52px}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:26px;letter-spacing:-1px}
.brand small{font-size:10px;letter-spacing:3px;display:block;margin-top:2px}
.brand-icon{background:var(--green);color:#fff5d4;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:26px;transform:rotate(-7deg)}
.nav{display:grid;gap:10px}
.nav button{padding:14px;border-radius:12px;text-align:left;background:transparent;color:#829087;font-size:14px}
.nav button.active{background:#e5e9dd;color:var(--green);font-weight:700}
.nav span{margin-right:10px}
.sidebar-note{margin-top:auto;font-size:11px;line-height:1.9;color:#8a948c}
.main{padding:32px 42px}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:37px}
.topbar strong{color:var(--ink);font-size:13px}
.online{display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;background:#5f996d;border-radius:50%}
.avatar{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#e7e8d9;color:#496457;margin-left:12px}
.eyebrow{font-size:10px;letter-spacing:2.5px;font-weight:800;color:#7c9482;text-transform:uppercase}
.greeting{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}
h1{font-size:31px;font-weight:750;margin:8px 0 9px;letter-spacing:-1px}
h1 em{font-style:normal;color:var(--orange)}
p{color:var(--muted);font-size:13px;line-height:1.8;margin:0}
.date-chip{font-size:12px;border:1px solid var(--line);padding:10px 15px;border-radius:100px}
.hero{background:#dfeadc;border-radius:24px;position:relative;overflow:hidden;min-height:350px;display:grid;grid-template-columns:46% 54%;border:1px solid #d9e5d6}
.hero-copy{padding:35px 0 32px 35px;z-index:1}
.tag{display:inline-block;padding:6px 10px;border-radius:6px;font-size:10px;background:#f6f5da;color:#677151;font-weight:700;letter-spacing:1px}
.hero h2{font-size:44px;letter-spacing:1px;margin:18px 0 6px}
.hero p{color:#658272;max-width:285px;line-height:1.9}
.hero-meta{display:flex;gap:14px;font-size:11px;color:#628071;margin:17px 0 24px}
.btn{border-radius:11px;padding:13px 20px;font-weight:650;font-size:13px;background:var(--green);color:white;display:inline-flex;gap:10px;align-items:center;justify-content:center}
.btn.light{background:#faf9ef;color:var(--green);border:1px solid #dce1d3}
.btn.orange{background:var(--orange);color:white}
.btn.small{padding:9px 13px;font-size:12px}
.hero-art{position:relative;min-height:340px;background:radial-gradient(ellipse at 50% 65%,#8ec8ac44,transparent 70%)}
.hero-art img{position:absolute;width:116%;max-width:none;left:-14%;top:-35px;height:425px;object-fit:contain}
.art-badge{position:absolute;right:21px;top:22px;transform:rotate(7deg);background:#fbf5d9;border-radius:50%;width:64px;height:64px;display:grid;place-content:center;text-align:center;font-size:10px;line-height:1.7;color:#69816a;box-shadow:0 5px 16px #64886b10}
.art-badge b{font-size:17px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:31px 0 17px}
.section-head h2{font-size:18px;margin:0}
.section-head small{font-size:11px;color:#8b9488}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.quick-card{background:#fffef8;border:1px solid var(--line);border-radius:16px;padding:21px;display:flex;align-items:center;gap:17px;cursor:pointer;text-align:left;color:var(--ink);transition:.2s}
.quick-card:hover{transform:translateY(-3px);box-shadow:0 8px 18px #344f3610}
.quick-icon{width:49px;height:49px;border-radius:14px;background:#f9e6d6;color:#b9794d;display:grid;place-items:center;font-size:24px}
.quick-icon.blue{background:#e2eaed;color:#66889a}
.quick-card h3{font-size:15px;margin:0 0 7px}
.quick-card p{font-size:11px}
.arrow{margin-left:auto;font-size:20px;color:#94a193}
.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.game-card{border:1px solid var(--line);border-radius:16px;background:#fffef8;overflow:hidden}
.game-art{height:112px;display:flex;align-items:center;justify-content:center;font-size:46px;position:relative;background:#ece8d9}
.game-art .status{position:absolute;top:12px;left:12px;font-size:9px;padding:4px 7px;background:#fffc;border-radius:4px;color:#717e70}
.game-art.chess{background:#e4e8df}
.game-art.cards{background:#f0e1d8}
.game-info{padding:16px}
.game-info h3{font-size:14px;margin:0 0 6px}
.game-info p{font-size:11px}
.footer{display:flex;justify-content:space-between;margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:10px;color:#959b90}
.modal-backdrop{position:fixed;inset:0;background:#142f3066;backdrop-filter:blur(5px);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:430px;max-width:100%;background:var(--paper);padding:30px;border-radius:23px;box-shadow:0 24px 100px #142f3033;position:relative}
.modal h2{margin:12px 0 8px;font-size:25px}
.modal label{font-size:12px;display:block;margin:22px 0 8px}
.modal input{width:100%;background:#fffef8;border:1px solid #dce1d5;padding:13px;border-radius:10px;color:var(--ink);outline:none}
.modal input:focus{border-color:#6e9981}
.modal .btn{width:100%;margin-top:23px}
.close{position:absolute;right:18px;top:15px;font-size:24px;background:transparent;color:#8e998f}
.room-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.room-head h1{font-size:24px}
.back{background:transparent;color:#7b8c80;font-size:12px;padding:0}
.room-code{padding:9px 13px;background:#e5e9df;border-radius:8px;font-size:12px}
.dice-row{display:flex;justify-content:center;gap:8px;margin:10px}
.lobby{max-width:690px;margin:30px auto;text-align:center}
.lobby-icon{font-size:44px;margin:25px}
.lobby h1{font-size:32px}
.lobby-actions{display:flex;gap:10px;justify-content:center}
.invite-box{padding:22px;background:#e6ecdf;border-radius:16px;margin:24px 0}
.invite-box strong{font-size:32px;letter-spacing:8px;display:block;margin:10px}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#244e43;color:white;padding:13px 20px;border-radius:12px;font-size:12px;z-index:100;transition:.3s;max-width:90%;box-shadow:0 6px 25px #0002}
#toast.show{transform:translateX(-50%) translateY(0)}
.rules-list{font-size:12px;line-height:2;color:#62786a;padding-left:20px}
.empty-seat{border:1px dashed #ccd6c8;border-radius:12px;display:grid;place-items:center;color:#96a18f;font-size:12px;padding:18px}
.mobile-brand{display:none}
.pill{font-size:10px;background:#e3eadc;padding:5px 8px;border-radius:20px;color:#738369}
.action-status{font-size:11px;color:#829180}
.mini-note{margin-top:15px;font-size:10px;line-height:1.8;color:#8d9889}
@media(min-width:1400px){
.main{padding:35px 55px}
.hero{min-height:390px}
.hero-art img{height:475px;top:-35px}
.hero-copy{padding-top:45px}
.hero h2{font-size:50px}
}
@media(max-width:1100px){
.shell{grid-template-columns:170px 1fr}
.sidebar{padding:30px 18px}
.main{padding:27px}
.hero-copy{padding:27px 0 25px 26px}
.hero h2{font-size:37px}
.hero-art img{height:375px}
}
@media(max-width:850px){
.shell{display:block}
.sidebar{display:none}
.main{padding:22px}
.mobile-brand{display:block}
.topbar{margin-bottom:28px}
.hero-art img{width:125%;left:-18%}
}
@media(max-width:560px){
.main{padding:20px 17px}
.topbar{margin-bottom:29px}
.topbar .desktop-label{display:none}
.brand{font-size:23px}
.brand-icon{width:35px;height:35px;font-size:21px;border-radius:10px}
.brand small{font-size:7px;letter-spacing:2px}
.online{font-size:10px}
.avatar{margin-left:3px;width:27px;height:27px}
h1{font-size:27px}
.greeting{margin-bottom:23px}
.greeting .date-chip{display:none}
.eyebrow{font-size:9px}
.hero{grid-template-columns:1fr;min-height:490px;border-radius:20px}
.hero-copy{padding:27px 26px 0}
.hero h2{font-size:38px;margin-top:14px}
.hero p{max-width:100%;font-size:12px}
.hero-meta{margin:13px 0 18px;gap:17px}
.hero-copy .btn{position:relative;z-index:3}
.hero-art{min-height:190px;margin-top:-20px}
.hero-art img{height:325px;width:115%;left:-4%;top:-75px}
.art-badge{width:52px;height:52px;right:23px;top:-118px;font-size:8px}
.art-badge b{font-size:14px}
.hero .tag{font-size:8px}
.quick-grid{gap:10px}
.quick-card{padding:16px 12px;gap:10px;align-items:flex-start}
.quick-icon{width:32px;height:34px;font-size:19px;border-radius:9px;flex-shrink:0}
.quick-card h3{font-size:12px;margin-top:2px;margin-bottom:5px}
.quick-card p{font-size:9px;line-height:1.6}
.quick-card .arrow{display:none}
.section-head{margin-top:27px}
.section-head h2{font-size:16px}
.section-head small{font-size:9px}
.catalog{gap:10px}
.game-art{height:80px;font-size:34px}
.game-art .status{top:7px;left:7px;font-size:7px;padding:3px 5px}
.game-info{padding:11px}
.game-info h3{font-size:11px}
.game-info p{font-size:8px}
.footer{font-size:8px;margin-top:25px}
.dice-row{margin:7px}
.room-head{margin-bottom:15px}
.room-head h1{font-size:21px;margin-top:9px}
.room-code{font-size:10px;padding:8px 9px}
.lobby{margin-top:0}
.lobby h1{font-size:26px}
.lobby-actions{flex-wrap:wrap}
.modal{padding:25px}
.mini-note{font-size:9px}
.lobby-icon{margin:18px}
.invite-box{padding:17px}
}

/* V4 tabletop: one viewport, one rectangular perimeter, everything else inside. */
:root{--muted:#61776d;--line:#d5dfd1}
button:disabled{cursor:not-allowed}
.btn{min-height:44px}
.close{min-width:44px;min-height:44px;top:10px;right:10px}
.room-tools{display:flex;align-items:center;gap:8px}
.motion-toggle{background:#fffdf4;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:#4b695d;min-height:36px}
.room-code{min-height:36px;font-weight:650}
.back{min-height:32px;color:#4e6a5c}
body:has(.playing){overflow:hidden}
.playing{display:block;width:100%;max-width:none;height:100dvh;min-height:0;overflow:hidden}
.playing .main{display:grid;grid-template-rows:44px minmax(0,1fr);gap:6px;width:100%;height:100%;min-width:0;min-height:0;padding:6px;overflow:hidden}
.playing .room-head{display:flex;align-items:center;justify-content:space-between;min-width:0;min-height:0;margin:0;padding:0 8px;gap:10px}
.playing .room-head>div:first-child{display:flex;align-items:center;gap:15px;min-width:0}
.playing .room-head h1{font-size:20px;margin:0;letter-spacing:0;white-space:nowrap}
.playing .room-head .back{font-size:12px;white-space:nowrap}
.playing .room-head .pill{vertical-align:middle;font-size:10px;letter-spacing:0}
.board-section{height:100%;width:100%;min-height:0;min-width:0}
.board{display:grid;grid-template-columns:repeat(var(--board-cols),minmax(0,1fr));grid-template-rows:repeat(var(--board-rows),minmax(0,1fr));gap:3px;padding:5px;width:100%;height:100%;min-width:0;min-height:0;background:#9fbfaf;border:1px solid #83a893;border-radius:14px;box-shadow:inset 0 0 0 2px #c1d7c7}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;min-height:0;padding:2px 3px 0;border-top:4px solid var(--tile-color,#bbcbb4);border-radius:7px;background:#fffaf0;color:#2c4a3d;touch-action:manipulation;isolation:isolate;overflow:hidden}
.tile:hover{background:#fff0ce;box-shadow:inset 0 0 0 2px #889e76}
.tile:focus-visible{outline-offset:-3px;z-index:3}
.tile.selected{outline:3px solid #d59a23;outline-offset:-3px;z-index:2;background:#fff0c3}
.tile-head{display:flex;align-items:center;justify-content:space-between;flex:none;width:100%;min-height:19px;gap:2px}
.tile-index{font-size:10px;font-weight:750;color:#527164;line-height:1}
.tile-art{display:block;width:70px;height:55px;max-width:100%;flex-shrink:0}
.tile>.tile-art{width:64%;height:0;min-height:0;flex:1;max-height:52px}
.tile-name{display:block;flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:12px;line-height:1.35;font-weight:750;white-space:nowrap;letter-spacing:0}
.tile-price{flex:none;font-size:10px;line-height:1.45;color:#57715f;font-variant-numeric:tabular-nums}
.owner-band,.special-band{display:flex;align-items:center;justify-content:center;gap:5px;flex:none;width:calc(100% + 6px);min-height:16px;margin-top:3px;padding:1px 2px;border-radius:0 0 5px 5px;background:#dde7d6;color:#47604a;font-size:10px;font-weight:750;line-height:1.2;white-space:nowrap}
.tile.owned .owner-band{background:var(--owner);color:white}
.owner-band span{font-size:9px}
.type-chance{background:#fff4d6;border-color:#dba653}.type-chance .special-band{background:#ebd291;color:#73521d}
.type-civic{background:#e9f3e6;border-color:#71a697}.type-civic .special-band{background:#c5dfd1;color:#3f6c5c}
.type-travel{background:#e7f3f4;border-color:#71aeb9}.type-travel .special-band{background:#c2dfe5;color:#326573}
.type-tax{background:#f7ecda;border-color:#ca9d7a}.type-tax .special-band{background:#ead4b9;color:#815f42}
.type-rest{background:#eef4de;border-color:#91ab6f}.type-start{background:#fff0d5;border-color:#d79b69}
.tile.mortgaged>.tile-art{opacity:.55;filter:grayscale(.65)}
.tile.mortgaged .owner-band{background:repeating-linear-gradient(-45deg,var(--owner),var(--owner) 5px,#606b6970 5px,#606b6970 9px)}
.tokens{display:flex;align-items:center;justify-content:flex-end;gap:2px;min-width:0;pointer-events:none}
.token{display:grid;place-items:center;flex:none;width:18px;height:19px;border:1px solid #fffaf0;border-radius:6px;background:var(--token);color:#fff;font-size:11px;font-style:normal;font-weight:850;line-height:1;box-shadow:0 1px 1px #244b4444}
.token.hopping{animation:pawn-hop .125s ease-out}.tile.landing-hop{background:#ffe39a}.tile.asset-celebration{animation:asset-pop .55s ease-out}
.board[data-density=compact] .tile{border-top-width:3px;padding:1px 1px 0;justify-content:space-between;border-radius:5px}
.board[data-density=compact] .tile>.tile-art,.board[data-density=compact] .tile-price{display:none}
.board[data-density=compact] .tile-name{font-size:11px;line-height:1.15}
.board[data-density=compact] .tile-head{min-height:13px;max-height:15px}
.board[data-density=compact] .tile-index{font-size:9px}
.board[data-density=compact] .token{width:11px;height:12px;border-radius:4px;font-size:9px}
.board[data-density=compact] .tokens{gap:1px}
.board[data-density=compact] .has-tokens .tile-index{display:none}
.board[data-density=compact] .has-tokens .tile-head{justify-content:center}
.board[data-density=compact] .owner-band,.board[data-density=compact] .special-band{width:calc(100% + 2px);min-height:12px;margin-top:1px;font-size:10px;line-height:1.1;padding:0 1px;gap:3px}
.board[data-density=micro]{gap:2px;padding:3px;border-radius:9px}
.board[data-density=micro] .tile{padding:0 1px;border-top-width:2px;border-radius:3px;justify-content:space-between}
.board[data-density=micro] .tile>.tile-art,.board[data-density=micro] .tile-price{display:none}
.board[data-density=micro] .tile-name{font-size:9.5px;line-height:11px;letter-spacing:-.15px}
.board[data-density=micro] .tile-head{min-height:8px;height:9px;gap:0}
.board[data-density=micro] .tile-index{font-size:8px;line-height:9px}
.board[data-density=micro] .token{width:8px;height:9px;border-width:.5px;border-radius:2px;font-size:7px;box-shadow:none}
.board[data-density=micro] .tokens{gap:1px}
.board[data-density=micro] .has-tokens .tile-index{display:none}
.board[data-density=micro] .has-tokens .tile-head{justify-content:center}
.board[data-density=micro] .owner-band,.board[data-density=micro] .special-band{width:calc(100% + 2px);min-height:10px;margin-top:0;padding:0;font-size:9px;line-height:10px;gap:2px;border-radius:0 0 2px 2px}
.board[data-density=micro] .owner-band span{font-size:8px}

/* Hub content scrolls; the perimeter never joins that scroll area. */
.table-hub{min-width:0;min-height:0;border-radius:10px;background:#edf1e7;border:1px solid #cee0ce;container-type:inline-size;overflow:hidden}
.hub-scroll{height:100%;min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:clamp(8px,1.2vw,18px)}
.phase-hud{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 13px;margin-bottom:12px;border:1px solid #cbdcc8;border-radius:12px;background:#e1eadb}
.phase-hud.your-turn{background:#dcead8;border-color:#a3b99c}
.turn-emblem{display:grid;place-items:center;flex:none;width:36px;height:38px;border-radius:11px;background:var(--player);border:2px solid #fff;color:#fff;font-size:22px;font-weight:850}
.phase-copy{min-width:0;flex:1}.phase-copy .eyebrow{font-size:9px;letter-spacing:1.2px}.phase-copy h2{font-size:20px;line-height:1.35;margin:3px 0;color:#244b3d}.phase-copy p{font-size:12px;line-height:1.5;color:#53705e;overflow-wrap:anywhere}
.phase-steps{display:flex;gap:10px;flex:none}.phase-steps span{display:grid;justify-items:center;gap:4px;font-size:10px;color:#6a816c}.phase-steps b{display:grid;place-items:center;width:22px;height:22px;border:1px solid #b9cfb5;border-radius:50%;background:#f3f7ee}.phase-steps .active b{background:#295d4e;color:#fff;border-color:#295d4e}.phase-steps .active{font-weight:750;color:#295d4e}.phase-steps .complete b{background:#c2d8b8}
.skip-animation{background:#f9fcf3;border:1px solid #b4c7ae;border-radius:7px;min-height:38px;padding:6px 9px;font-size:11px;color:#476646;flex:none}.event-reading{font-size:11px;font-weight:650;color:#486b45;white-space:nowrap}
.player-list{display:grid;grid-template-columns:1fr;gap:8px}.hub-players{grid-template-columns:repeat(var(--player-count),minmax(0,1fr));margin-bottom:14px;align-items:stretch}
.player{display:flex;align-items:center;gap:10px;width:100%;min-width:0;padding:10px 11px;border:1px solid #d5dfd0;border-left:4px solid var(--player);border-radius:10px;background:#fffdf5;text-align:left;color:var(--ink)}
.player.turn{border-color:var(--player);box-shadow:inset 0 0 0 1px var(--player)}.player.is-you{background:#f6f1ff}.player.bankrupt{opacity:.6}

  const property = g.propertyState?.[tile.id];
  const level = property?.level ?? tile.level ?? 0, mortgaged = property?.mortgaged ?? tile.mortgaged ?? false;
  const group = g.board.filter(t => t.type === 'property' && t.group === tile.group);
  const fullSet = owner && group.length > 1 && group.every(t => g.owners[t.id] === owner.id && !(g.propertyState?.[t.id]?.mortgaged ?? t.mortgaged));
